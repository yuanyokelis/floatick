name: Launch smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Boot app on emulator and capture logcat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am start -n com.example.floatick/.ui.MainActivity || true
            sleep 12
            adb logcat -d -v brief > "$GITHUB_WORKSPACE/emulator-logcat.txt" || true
            echo "=== FATAL / AndroidRuntime ==="
            grep -iE "FATAL|AndroidRuntime|Force finishing|Process: com.example.floatick" "$GITHUB_WORKSPACE/emulator-logcat.txt" || echo "(no crash signature found)"
            echo "=== top activity ==="
            adb shell dumpsys activity activities | grep -i floatick | head -20 || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: emulator-logcat.txt
          if-no-files-found: ignore
